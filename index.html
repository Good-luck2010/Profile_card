<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="shortcut icon" href="./file_00000000019081f4b42884e397e6467b.png" type="image/x-icon">

    
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      background-color: whitesmoke;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background: #f8f9fa;
      width: 100%;
      max-width: 340px;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d8871d, #ebd125);
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }

    h2 {
      color: #1e293b;
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
    }

    .stack {
      color: #d8871d;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    p {
      color: #6b7280;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background-color: #ebd125;
      color: white;
      text-decoration: none;
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #d8871d;
    }
  </style>

</head>
<body>
    

  <section class="card">
    <div class="logo">GT</div>
    <h2>Atanda Iyanuoluwa</h2>
    <div class="stack">Frontend Developer</div>
    <p>Building clean, accessible, and responsive user interfaces with modern HTML, CSS, JavaSript.</p>
    <a href="https://good-luck2010.github.io/Portfolio/" class="btn">View Portfolio</a>
  </section>

</body>
</html>
